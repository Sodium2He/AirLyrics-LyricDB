name: Android Instrumentation

on:
  pull_request:
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/java/com/andsi/airlyrics/core/model/SongIdentity.kt'
      - 'app/src/main/java/com/andsi/airlyrics/lyrics/storage/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - '.github/workflows/android-instrumentation.yml'
  push:
    branches:
      - main
    paths:
      - 'app/src/androidTest/**'
      - 'app/src/main/java/com/andsi/airlyrics/core/model/SongIdentity.kt'
      - 'app/src/main/java/com/andsi/airlyrics/lyrics/storage/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'gradlew'
      - '.github/workflows/android-instrumentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation-x86_64:
    name: Run Android instrumentation on x86_64 emulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run all Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            --stacktrace

      - name: Verify instrumentation test results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          report_root = Path("app/build/outputs/androidTest-results/connected")
          reports = sorted(report_root.rglob("TEST-*.xml"))
          if not reports:
              sys.exit(f"No instrumentation XML reports found under {report_root}")

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, "0"))

          print("Instrumentation results:", totals)
          if totals["tests"] == 0:
              sys.exit("No instrumentation tests ran")

          incomplete = {
              key: totals[key]
              for key in ("failures", "errors", "skipped")
              if totals[key]
          }
          if incomplete:
              sys.exit(f"Instrumentation tests were not clean: {incomplete}")
          PY

      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: airlyrics-instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
